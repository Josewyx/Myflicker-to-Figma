<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
:root{color-scheme:light dark;font:12px system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--figma-color-text,#253b30);background:var(--figma-color-bg,#fff)}*{box-sizing:border-box}body{margin:0}#panel{padding:12px 14px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.identity{display:flex;align-items:center;gap:9px;min-width:0}.dot{width:9px;height:9px;flex:none;border-radius:50%;background:#c19b39}body[data-state=connected] .dot{background:#169b66}body[data-state=blocked] .dot{background:#d17737}#state-label{font-size:15px;font-weight:650}#document{font-size:11px;color:var(--figma-color-text-secondary,#68766f);margin-top:4px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:180px}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--figma-color-border,#d9e2dc);background:var(--figma-color-bg-secondary,#f6f8f6);color:inherit;border-radius:6px;padding:5px 8px}button:disabled{opacity:.5}button:focus-visible{outline:2px solid #5fae89;outline-offset:2px}#hint{font-size:10px;color:var(--figma-color-text-secondary,#68766f);margin:10px 0 0}#status{font-size:11px;line-height:1.6;margin:10px 0 0;overflow-wrap:anywhere}body[data-state=connected][data-notice=false] #status{display:none}.settings-row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}#settings{font-size:10px}#version{font-size:10px;color:var(--figma-color-text-tertiary,#8a958e)}#advanced summary{display:none}#advanced{margin-top:8px}label{display:block;font-size:10px;margin:10px 0 4px}input{width:100%;padding:6px;border:1px solid var(--figma-color-border,#d9e2dc);background:var(--figma-color-bg,#fff);color:inherit;border-radius:5px}small{display:block;font-size:10px;line-height:1.6;margin:8px 0;color:var(--figma-color-text-secondary,#68766f)}#connect{margin-bottom:4px}body[data-compact=true] #hint,body[data-compact=true] #status,body[data-compact=true] .settings-row,body[data-compact=true] #advanced{display:none}
</style></head><body data-state="connecting" data-compact="false"><div id="panel">
<header><div class="identity"><span class="dot"></span><div><div id="state-label">连接中</div><div id="document">等待当前文件…</div></div></div><button id="compact" aria-label="收起插件窗口">收起</button></header>
<p id="hint">关闭会断开连接，收起不会。</p><p id="status">正在连接Myflicker-to-Figma 服务…</p><div class="settings-row"><button id="settings" aria-expanded="false">连接设置</button><span id="version"></span></div>
<details id="advanced"><summary>连接设置</summary><button id="connect">重试连接</button><label for="file">文件链接（通常无需填写）</label><input id="file" placeholder="可留空"><label for="token">手动配对（排错备用）</label><input id="token" type="password" autocomplete="off"><button id="advanced-connect">使用手动配对</button><small>通常不需要填写。回到 MyFlicker 说“连接 Figma”可打开向导。</small></details>
</div><script>/*CLIENT*/</script></body></html>
